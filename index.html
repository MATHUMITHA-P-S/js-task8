<!DOCTYPE html>
<html>
<head>
  <title>Movie Ticket Booking</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Movie Ticket Booking</h1>
<form id="bookingForm">
    <label>Movie:</label>
    <select id="movie">
      <option value="Avengers" data-price="250">Avengers - Rs 250</option>
      <option value="Inception" data-price="200">Inception - Rs 200</option>
      <option value="Interstellar" data-price="300">Interstellar - Rs 300</option>
    </select><br><br>
    <label>Showtime:</label>
    <select id="showtime">
      <option>10:00 AM</option>
      <option>2:00 PM</option>
      <option>6:00 PM</option>
    </select><br><br>
   <label>Tickets:</label>
    <input type="number" id="tickets" min="1"><br><br>
    <label>Email:</label>
    <input type="email" id="email"><br><br>
    <button type="button" id="bookBtn">Book Ticket</button>
    <button type="reset">Reset</button>
</form>
  <h2>Bookings</h2>
  <ul id="bookingList"></ul>
  <script src="index.js"></script>
</body>
</html>
